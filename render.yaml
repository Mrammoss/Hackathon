services:
  - type: web
    name: pothole-tracker
    runtime: ruby
    plan: free
    region: ohio
    buildCommand: bundle install && SECRET_KEY_BASE_DUMMY=1 bundle exec rails assets:precompile
    startCommand: bin/render-start
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pothole-tracker-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: pothole-tracker-db
    plan: free
    region: ohio
    databaseName: pothole_tracker
    user: pothole_tracker
